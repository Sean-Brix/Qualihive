<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="rotorMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9dde2"/>
      <stop offset="45%" stop-color="#8c96a1"/>
      <stop offset="100%" stop-color="#4d5660"/>
    </linearGradient>
    <radialGradient id="hubMetal" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#eef1f4"/>
      <stop offset="55%" stop-color="#929ca7"/>
      <stop offset="100%" stop-color="#404851"/>
    </radialGradient>
    <filter id="rotorShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!--
    ASSET 02: Reusable pump rotor overlay
    Shared master canvas/viewBox: 1200 x 500
    Native reference position: P1
    Rotation pivot in master coordinates: (303, 352)

    Reuse in Flutter:
      P1 translation: Offset(0, 0)
      P2 translation: Offset(170, 0)
      P3 translation: Offset(340, 0)
      P4 translation: Offset(510, 0)

    Rotate around the rotor's visual center after applying the translation.
  -->

  <g id="pump_rotor" transform="translate(303 352)" filter="url(#rotorShadow)">
    <!-- subtle backing ring -->
    <circle cx="0" cy="0" r="17.5"
            fill="none"
            stroke="#7e8893"
            stroke-width="2"
            opacity="0.9"/>

    <!-- six curved impeller blades -->
    <g fill="url(#rotorMetal)" stroke="#3f4750" stroke-width="1">
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z"/>
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z" transform="rotate(60)"/>
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z" transform="rotate(120)"/>
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z" transform="rotate(180)"/>
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z" transform="rotate(240)"/>
      <path d="M 2 -4
               C 5 -15, 11 -18, 16 -17
               C 13 -10, 9 -5, 4 -1
               Z" transform="rotate(300)"/>
    </g>

    <!-- central hub -->
    <circle cx="0" cy="0" r="6.7"
            fill="url(#hubMetal)"
            stroke="#2f363d"
            stroke-width="1.2"/>
    <circle cx="-1.8" cy="-1.8" r="1.6"
            fill="#f7f8fa"
            opacity="0.75"/>
  </g>
</svg>
