<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="honeyStage2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c85c" stop-opacity="0.26"/>
      <stop offset="48%" stop-color="#dca33a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#b97716" stop-opacity="0.52"/>
    </linearGradient>

    <!-- Medium filtration pattern: tighter mesh than stage 1 -->
    <pattern id="mediumMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0 L8 8 M8 0 L0 8"
            stroke="#7d6b4d"
            stroke-width="0.9"
            stroke-opacity="0.42"/>
    </pattern>

    <clipPath id="filter2Clip">
      <rect x="544" y="158" width="72" height="108" rx="5"/>
    </clipPath>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!--
    ASSET 05: Filter 2 processing/media overlay
    Shared master canvas/viewBox: 1200 x 500

    Native inner area:
      x=544, y=158, width=72, height=108

    Intended meaning:
      Stage 2 / medium filtration is actively processing honey.

    Flutter animation suggestion:
      opacity: 0.0 inactive, 0.7-1.0 active
      subtle shimmer: translateY -3px to +3px
      optional highlight sweep every 1.2-1.8 sec

    Render ABOVE machine_base.svg.
  -->

  <g id="filter2_processing" clip-path="url(#filter2Clip)">
    <rect x="544" y="158" width="72" height="108" fill="url(#honeyStage2)"/>

    <!-- tighter mesh -->
    <rect x="548" y="164" width="64" height="96" rx="4"
          fill="url(#mediumMesh)"
          opacity="0.76"/>

    <!-- moving shimmer zone -->
    <path d="M548 196
             C565 187, 588 188, 612 197
             L612 216
             C589 208, 569 208, 548 217 Z"
          fill="#ffe7a0"
          fill-opacity="0.26"
          filter="url(#softGlow2)"/>

    <!-- slight cleaner tone toward bottom to suggest progressive filtration -->
    <rect x="547" y="230" width="66" height="32" rx="4"
          fill="#f4d99a"
          fill-opacity="0.13"/>

    <rect x="550" y="163" width="60" height="4" rx="2"
          fill="#fff7d7"
          fill-opacity="0.30"/>
  </g>
</svg>
