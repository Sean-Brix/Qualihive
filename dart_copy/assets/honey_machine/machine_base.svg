<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="50%" stop-color="#d6d9de"/>
      <stop offset="100%" stop-color="#aeb4bc"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59616c"/>
      <stop offset="100%" stop-color="#222831"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- IMPORTANT: All future overlay assets should use the exact same 1200x500 viewBox -->

  <g id="machine_base" filter="url(#softShadow)">

    <!-- FRAME -->
    <g id="frame" fill="url(#metal)" stroke="#76808d" stroke-width="2">
      <rect x="45" y="70" width="1110" height="18" rx="4"/>
      <rect x="45" y="420" width="1110" height="18" rx="4"/>
      <rect x="45" y="70" width="18" height="368" rx="4"/>
      <rect x="1137" y="70" width="18" height="368" rx="4"/>
      <rect x="885" y="88" width="12" height="332" rx="3"/>
    </g>

    <!-- HOPPER -->
    <g id="hopper" stroke="#6d7680" stroke-width="2">
      <path d="M90 110 H250 L228 205 H112 Z" fill="url(#metal)"/>
      <path d="M112 205 H228 L212 235 H128 Z" fill="#c2c7ce"/>
      <rect x="153" y="235" width="34" height="38" rx="7" fill="url(#darkMetal)"/>
      <rect x="159" y="245" width="22" height="18" rx="4" fill="#3c434c"/>
    </g>

    <!-- PIPING BACKBONE -->
    <g id="pipes" fill="none" stroke="#8d959f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 273 H190 V335 H270"/>
      <path d="M336 335 H390 V315 H425"/>
      <path d="M505 335 H560 V315 H595"/>
      <path d="M675 335 H730 V315 H765"/>
      <path d="M845 335 H930 V305 H965"/>
    </g>
    <g fill="none" stroke="#d9dde2" stroke-width="8" stroke-linecap="round">
      <path d="M170 273 H190 V335 H270"/>
      <path d="M336 335 H390 V315 H425"/>
      <path d="M505 335 H560 V315 H595"/>
      <path d="M675 335 H730 V315 H765"/>
      <path d="M845 335 H930 V305 H965"/>
    </g>

    <!-- PUMPS (STATIC HOUSINGS ONLY) -->
    <g id="pump_bodies">
      <g id="pump1" transform="translate(270,282)">
        <rect x="0" y="0" width="66" height="112" rx="14" fill="url(#darkMetal)" stroke="#111827" stroke-width="2"/>
        <rect x="10" y="14" width="46" height="32" rx="10" fill="#3d4651"/>
        <circle cx="33" cy="70" r="22" fill="#151a20" stroke="#89929c" stroke-width="3"/>
        <rect x="18" y="105" width="30" height="14" rx="3" fill="#737b84"/>
      </g>

      <g id="pump2" transform="translate(440,282)">
        <rect x="0" y="0" width="66" height="112" rx="14" fill="url(#darkMetal)" stroke="#111827" stroke-width="2"/>
        <rect x="10" y="14" width="46" height="32" rx="10" fill="#3d4651"/>
        <circle cx="33" cy="70" r="22" fill="#151a20" stroke="#89929c" stroke-width="3"/>
        <rect x="18" y="105" width="30" height="14" rx="3" fill="#737b84"/>
      </g>

      <g id="pump3" transform="translate(610,282)">
        <rect x="0" y="0" width="66" height="112" rx="14" fill="url(#darkMetal)" stroke="#111827" stroke-width="2"/>
        <rect x="10" y="14" width="46" height="32" rx="10" fill="#3d4651"/>
        <circle cx="33" cy="70" r="22" fill="#151a20" stroke="#89929c" stroke-width="3"/>
        <rect x="18" y="105" width="30" height="14" rx="3" fill="#737b84"/>
      </g>

      <g id="pump4" transform="translate(780,282)">
        <rect x="0" y="0" width="66" height="112" rx="14" fill="url(#darkMetal)" stroke="#111827" stroke-width="2"/>
        <rect x="10" y="14" width="46" height="32" rx="10" fill="#3d4651"/>
        <circle cx="33" cy="70" r="22" fill="#151a20" stroke="#89929c" stroke-width="3"/>
        <rect x="18" y="105" width="30" height="14" rx="3" fill="#737b84"/>
      </g>
    </g>

    <!-- FILTER HOUSINGS -->
    <g id="filters">
      <g id="filter1">
        <rect x="350" y="130" width="120" height="170" rx="12" fill="#e9ecef" stroke="#6b7280" stroke-width="3"/>
        <rect x="366" y="150" width="88" height="124" rx="8" fill="#c9cfd6" stroke="#9199a3" stroke-width="2"/>
        <rect x="374" y="158" width="72" height="108" rx="5" fill="#9ca3af" opacity="0.42"/>
        <circle cx="360" cy="140" r="4" fill="#59616c"/>
        <circle cx="460" cy="140" r="4" fill="#59616c"/>
        <circle cx="360" cy="290" r="4" fill="#59616c"/>
        <circle cx="460" cy="290" r="4" fill="#59616c"/>
      </g>

      <g id="filter2">
        <rect x="520" y="130" width="120" height="170" rx="12" fill="#e9ecef" stroke="#6b7280" stroke-width="3"/>
        <rect x="536" y="150" width="88" height="124" rx="8" fill="#c9cfd6" stroke="#9199a3" stroke-width="2"/>
        <rect x="544" y="158" width="72" height="108" rx="5" fill="#b9822e" opacity="0.32"/>
        <circle cx="530" cy="140" r="4" fill="#59616c"/>
        <circle cx="630" cy="140" r="4" fill="#59616c"/>
        <circle cx="530" cy="290" r="4" fill="#59616c"/>
        <circle cx="630" cy="290" r="4" fill="#59616c"/>
      </g>

      <g id="filter3">
        <rect x="690" y="130" width="120" height="170" rx="12" fill="#e9ecef" stroke="#6b7280" stroke-width="3"/>
        <rect x="706" y="150" width="88" height="124" rx="8" fill="#c9cfd6" stroke="#9199a3" stroke-width="2"/>
        <rect x="714" y="158" width="72" height="108" rx="5" fill="#e6e7e8" opacity="0.82"/>
        <circle cx="700" cy="140" r="4" fill="#59616c"/>
        <circle cx="800" cy="140" r="4" fill="#59616c"/>
        <circle cx="700" cy="290" r="4" fill="#59616c"/>
        <circle cx="800" cy="290" r="4" fill="#59616c"/>
      </g>
    </g>

    <!-- CONTROL BOX -->
    <g id="control_box">
      <rect x="920" y="110" width="185" height="190" rx="14" fill="#e7e9ec" stroke="#6b7280" stroke-width="3"/>
      <rect x="948" y="138" width="84" height="62" rx="5" fill="#29313a" stroke="#111827" stroke-width="2"/>
      <rect x="958" y="148" width="64" height="42" rx="3" fill="#56616d"/>
      <circle cx="966" cy="232" r="13" fill="#377f4b" stroke="#205b31" stroke-width="3"/>
      <circle cx="1015" cy="232" r="13" fill="#ba3f36" stroke="#7f241d" stroke-width="3"/>
      <rect x="1060" y="135" width="22" height="12" rx="4" fill="#626b75"/>
      <rect x="1060" y="160" width="22" height="12" rx="4" fill="#626b75"/>
      <rect x="1060" y="185" width="22" height="12" rx="4" fill="#626b75"/>
    </g>

    <!-- OUTPUT PLATFORM -->
    <g id="platform">
      <rect x="925" y="380" width="170" height="18" rx="5" fill="#606973" stroke="#353b43" stroke-width="2"/>
      <rect x="945" y="398" width="130" height="12" rx="4" fill="#a8afb7"/>
      <rect x="960" y="410" width="18" height="18" rx="2" fill="#747d86"/>
      <rect x="1042" y="410" width="18" height="18" rx="2" fill="#747d86"/>
    </g>

    <!-- OUTPUT JAR BODY -->
    <g id="jar_body">
      <path d="M970 310 H1050 L1044 365 Q1042 380 1028 380 H992 Q978 380 976 365 Z"
            fill="#f6f7f9" fill-opacity="0.55" stroke="#8d959f" stroke-width="3"/>
      <rect x="977" y="298" width="66" height="18" rx="6" fill="#c4c9cf" stroke="#8d959f" stroke-width="2"/>
      <line x1="988" y1="302" x2="988" y2="313" stroke="#8d959f" stroke-width="1"/>
      <line x1="1000" y1="302" x2="1000" y2="313" stroke="#8d959f" stroke-width="1"/>
      <line x1="1012" y1="302" x2="1012" y2="313" stroke="#8d959f" stroke-width="1"/>
      <line x1="1024" y1="302" x2="1024" y2="313" stroke="#8d959f" stroke-width="1"/>
    </g>

  </g>
</svg>
