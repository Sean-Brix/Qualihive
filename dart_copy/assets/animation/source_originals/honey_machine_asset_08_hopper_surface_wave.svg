<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">
  <defs>
    <filter id="surfaceSoftGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!--
    ASSET 08 — HOPPER LIQUID SURFACE / MENISCUS

    MASTER CANVAS
      viewBox: 0 0 1200 500
      Must remain unchanged.

    IMPORTANT IMPLEMENTATION DETAIL
      This SVG intentionally has NO internal hopper clip.
      In Flutter, place it inside a FIXED external hopper ClipPath, then
      translate only this surface asset. This preserves the correct surface
      width as the hopper narrows toward the bottom.

    FIXED HOPPER CLIP POLYGON
      (98.0, 118.0)
      (242.0, 118.0)
      (222.5, 198.0)
      (117.5, 198.0)

    REFERENCE SURFACE CENTER
      y = 198.0

    LEVEL MAPPING
      surfaceY = 198.0 - (80.0 * hopperLevel)
      translateY = surfaceY - 198.0
                 = -(80.0 * hopperLevel)

      0.00 -> y 198.0
      0.25 -> y 178.0
      0.50 -> y 158.0
      0.75 -> y 138.0
      1.00 -> y 118.0

    SURFACE WIDTH AFTER EXTERNAL CLIPPING
      width(level) = 105 + (39 * hopperLevel) px
      0.00 -> 105.00 px
      0.50 -> 124.50 px
      1.00 -> 144.00 px

    HORIZONTAL LOOP
      Wave period = 24.0px
      Animate translateX from 0 to -24.0px and repeat.
      Use a slow duration, approximately 1600–2400 ms.
      The surface should be subtle, not turbulent.

    VISIBILITY
      Hide when hopperLevel <= 0.01.
      Fade in between approximately 0.01 and 0.05 if desired.

    STACK ORDER
      machine_base.svg
      hopper_honey_fill.svg
      hopper_surface_wave.svg
      other status overlays
  -->

  <g id="hopper_surface_wave">
    <!-- Slight amber body makes the meniscus readable on top of the fill. -->
    <path d="M 72.0 198.0 Q 78.0 195.6, 84.0 198.0 Q 90.0 200.4, 96.0 198.0 Q 102.0 195.6, 108.0 198.0 Q 114.0 200.4, 120.0 198.0 Q 126.0 195.6, 132.0 198.0 Q 138.0 200.4, 144.0 198.0 Q 150.0 195.6, 156.0 198.0 Q 162.0 200.4, 168.0 198.0 Q 174.0 195.6, 180.0 198.0 Q 186.0 200.4, 192.0 198.0 Q 198.0 195.6, 204.0 198.0 Q 210.0 200.4, 216.0 198.0 Q 222.0 195.6, 228.0 198.0 Q 234.0 200.4, 240.0 198.0 Q 246.0 195.6, 252.0 198.0 Q 258.0 200.4, 264.0 198.0 L 268.0 198.0"
          fill="none"
          stroke="#C77A12"
          stroke-width="4.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.72"
          filter="url(#surfaceSoftGlow)"/>

    <!-- Main crisp surface line. -->
    <path d="M 72.0 198.0 Q 78.0 195.6, 84.0 198.0 Q 90.0 200.4, 96.0 198.0 Q 102.0 195.6, 108.0 198.0 Q 114.0 200.4, 120.0 198.0 Q 126.0 195.6, 132.0 198.0 Q 138.0 200.4, 144.0 198.0 Q 150.0 195.6, 156.0 198.0 Q 162.0 200.4, 168.0 198.0 Q 174.0 195.6, 180.0 198.0 Q 186.0 200.4, 192.0 198.0 Q 198.0 195.6, 204.0 198.0 Q 210.0 200.4, 216.0 198.0 Q 222.0 195.6, 228.0 198.0 Q 234.0 200.4, 240.0 198.0 Q 246.0 195.6, 252.0 198.0 Q 258.0 200.4, 264.0 198.0 L 268.0 198.0"
          fill="none"
          stroke="#E5A126"
          stroke-width="2.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.96"/>

    <!-- Thin reflective highlight. -->
    <path d="M 72.0 196.9 Q 78.0 194.5, 84.0 196.9 Q 90.0 199.3, 96.0 196.9 Q 102.0 194.5, 108.0 196.9 Q 114.0 199.3, 120.0 196.9 Q 126.0 194.5, 132.0 196.9 Q 138.0 199.3, 144.0 196.9 Q 150.0 194.5, 156.0 196.9 Q 162.0 199.3, 168.0 196.9 Q 174.0 194.5, 180.0 196.9 Q 186.0 199.3, 192.0 196.9 Q 198.0 194.5, 204.0 196.9 Q 210.0 199.3, 216.0 196.9 Q 222.0 194.5, 228.0 196.9 Q 234.0 199.3, 240.0 196.9 Q 246.0 194.5, 252.0 196.9 Q 258.0 199.3, 264.0 196.9 L 268.0 196.9"
          fill="none"
          stroke="#FFF0B0"
          stroke-width="1.05"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.72"/>
  </g>
</svg>
