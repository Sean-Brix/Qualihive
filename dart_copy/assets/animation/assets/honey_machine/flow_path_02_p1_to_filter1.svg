<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">
  <defs>
    <filter id="flowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
  </defs>

  <!--
    ASSET 12 — FLOW PATH 02: P1 → FILTER 1

    MASTER CANVAS
      viewBox: 0 0 1200 500
      Must remain unchanged.

    EXACT CENTERLINE
      M 336 335 H 390 V 315 H 425

    ROUTE
      start / P1 outlet:       (336.0, 335.0)
      corner 1:                (390.0, 335.0)
      corner 2:                (390.0, 315.0)
      end / Filter 1 inlet:    (425.0, 315.0)

    TOTAL CENTERLINE LENGTH
      109.0px

    PIPE MATCH
      machine_base inner pipe stroke = 8px
      animated honey main stroke = 4.8px
      glow stroke = 8.0px

    RECOMMENDED ANIMATION
      strokeDasharray = "11.0 9.0"
      dash period = 20.0px
      animate strokeDashoffset 0 → -20.0
      repeat while this route is active.

    TYPICAL ACTIVATION
      running && pump1 && stage permits transfer into Filter 1

    DIRECTION
      P1 → Filter 1
      start distance 0.0 → end distance 109.0

    STACK ORDER
      machine_base.svg
      flow_path_02_p1_to_filter1.svg
      filter processing overlays
      pump rotor/glow
      status overlays
  -->

  <g id="flow_path_02_p1_to_filter1">
    <!-- Soft amber glow -->
    <path d="M 336 335 H 390 V 315 H 425"
          fill="none"
          stroke="#E49A23"
          stroke-width="8.0"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.22"
          filter="url(#flowGlow)"/>

    <!-- Primary moving honey dashes -->
    <path id="flow_dashes"
          d="M 336 335 H 390 V 315 H 425"
          fill="none"
          stroke="#E8A62D"
          stroke-width="4.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="11.0 9.0"
          stroke-dashoffset="0"
          opacity="0.98"/>

    <!-- Fine highlight -->
    <path d="M 336 335 H 390 V 315 H 425"
          fill="none"
          stroke="#FFD974"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="11.0 9.0"
          stroke-dashoffset="-1.5"
          opacity="0.72"/>

    <!-- Hidden registration markers -->
    <circle cx="336.0" cy="335.0" r="2.2"
            fill="#FFD974" opacity="0.0"/>
    <circle cx="425.0" cy="315.0" r="2.2"
            fill="#FFD974" opacity="0.0"/>
  </g>
</svg>
