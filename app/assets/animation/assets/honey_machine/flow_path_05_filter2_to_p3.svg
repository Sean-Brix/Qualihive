<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">
  <defs>
    <filter id="internalFlowGlow" x="-60%" y="-50%" width="220%" height="200%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
  </defs>

  <!--
    ASSET 15 — FLOW PATH 05: FILTER 2 → P3

    MASTER CANVAS
      viewBox: 0 0 1200 500
      Must remain unchanged.

    CLASSIFICATION
      conceptual_internal_transfer

    ENGINEERING CLARIFICATION
      The current app machine-base illustration does not expose a distinct
      pipe segment between Filter 2 and Pump 3. This overlay therefore shows
      the process transition through a hidden/short connection. It is an app
      visualization, NOT a fabrication pipe route or dimensional specification.

    EXACT APP ANCHORS
      Filter 2 media bottom-center: (580.0, 266.0)
      Filter 2 housing bottom:       (580.0, 300.0)
      P3 conceptual inlet:           (610.0, 335.0)

    PATH
      M 580 266 V 300 C 580 320 590 335 610 335

    PATH LENGTH
      straight section: 34.0px
      curved section:   52.111px
      total:            86.111px

    ANIMATION
      strokeDasharray = "9.0 8.0"
      dash period = 17.0px
      strokeDashoffset: 0 → -17.0
      recommended duration: 500–850 ms
      repeat only while route is active.

    TYPICAL ACTIVE CONDITION
      running && filter2Processing && pump3

    VISUAL DISTINCTION
      This hidden-transfer route intentionally uses:
        main stroke = 4.4px
        lower opacity than exposed-pipe flow
      so operators can distinguish conceptual/internal transitions from
      visible pipe sections.

    STACK ORDER
      machine_base.svg
      filter2_processing_overlay.svg
      flow_path_05_filter2_to_p3.svg
      pump3 rotor/glow
      status overlays
  -->

  <g id="flow_path_05_filter2_to_p3">
    <path d="M 580 266 V 300 C 580 320 590 335 610 335"
          fill="none"
          stroke="#D98D1D"
          stroke-width="7.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.18"
          filter="url(#internalFlowGlow)"/>

    <path id="flow_dashes"
          d="M 580 266 V 300 C 580 320 590 335 610 335"
          fill="none"
          stroke="#E7A12A"
          stroke-width="4.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="9.0 8.0"
          stroke-dashoffset="0"
          opacity="0.92"/>

    <path d="M 580 266 V 300 C 580 320 590 335 610 335"
          fill="none"
          stroke="#FFD975"
          stroke-width="1.10"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="9.0 8.0"
          stroke-dashoffset="-1.2"
          opacity="0.66"/>

    <!-- Hidden registration markers -->
    <circle cx="580.0" cy="266.0" r="2"
            fill="#FFD975" opacity="0"/>
    <circle cx="610.0" cy="335.0" r="2"
            fill="#FFD975" opacity="0"/>
  </g>
</svg>
