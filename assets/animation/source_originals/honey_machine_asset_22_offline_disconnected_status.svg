<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="offlineFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C84"/>
      <stop offset="45%" stop-color="#E4574F"/>
      <stop offset="100%" stop-color="#9E2F2A"/>
    </linearGradient>

    <radialGradient id="offlineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF736A" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#E24F48" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#E24F48" stop-opacity="0"/>
    </radialGradient>

    <filter id="offlineSoftGlow" x="-120%" y="-200%" width="340%" height="500%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>
  </defs>

  <!--
    ASSET 22 — OFFLINE / DISCONNECTED STATUS OVERLAY

    MASTER CANVAS
      viewBox: 0 0 1200 500
      Must remain unchanged.

    EXACT REGISTRATION
      connectivity indicator slot:
        x = 1060.0
        y = 135.0
        width = 22.0
        height = 12.0
        corner radius = 4.0
        center = (1071.0, 141.0)

    SLOT ASSIGNMENT
      Top control-panel indicator = connectivity status.
      Asset 21 and Asset 22 are mutually exclusive states for this same slot.

    PURPOSE
      Indicate that the device is disconnected, unreachable, or telemetry
      has become stale beyond the accepted freshness timeout.

    RECOMMENDED VISIBILITY LOGIC
      show when:
        connected == false
        OR telemetryStale == true

      hide when:
        connected == true
        AND telemetryStale == false

    RECOMMENDED ANIMATION
      Normal offline:
        red face visible
        soft slow pulse

      Connection lost transition:
        optional 2 quick pulses, then settle
        do not flash continuously at high frequency

      Suggested slow pulse:
        glow opacity 0.18 -> 0.50 -> 0.18
        duration 1200-1800 ms

    UX NOTE
      Red here means communication failure/unavailable data.
      Machine-process faults should use Asset 23 Warning/Error instead.

    STACK ORDER
      machine_base.svg
      offline_disconnected_status.svg
      warning/error overlay if present
  -->

  <g id="offline_disconnected_status">
    <!-- diffuse red connectivity glow -->
    <rect x="1053.0"
          y="129.0"
          width="36.0"
          height="24.0"
          rx="10"
          fill="url(#offlineGlow)"
          opacity="0.88"
          filter="url(#offlineSoftGlow)"/>

    <!-- exact offline face -->
    <rect x="1060.0"
          y="135.0"
          width="22.0"
          height="12.0"
          rx="4.0"
          fill="url(#offlineFace)"
          stroke="#FFC1BC"
          stroke-width="0.9"
          opacity="0.98"/>

    <!-- disconnected slash -->
    <path d="M 1065.0 138.0
             L 1077.0 144.0"
          stroke="#FFE3E0"
          stroke-width="1.4"
          stroke-linecap="round"
          opacity="0.88"/>

    <!-- subtle highlight -->
    <rect x="1062.2"
          y="136.5"
          width="17.6"
          height="1.8"
          rx="0.9"
          fill="#FFF1F0"
          fill-opacity="0.42"/>
  </g>
</svg>
