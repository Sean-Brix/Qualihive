name: Build and release APK

# Builds the release APK on GitHub's runners and attaches it to a GitHub
# Release, which is what the download site links to.
#
#   git tag v1.0.0 && git push origin v1.0.0     → builds and publishes v1.0.0
#   Actions → "Build and release APK" → Run      → builds and attaches to the
#                                                  tag you type in
#
# The APK is signed with the debug keystore that `expo prebuild` generates —
# fine for sideloading on the farm's phones. Add a real keystore before any
# Play Store upload.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        run: node scripts/build-apk.mjs --all-abis

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Qualihive ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: app/dist/qualihive-release.apk
